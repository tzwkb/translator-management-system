<style>
  :root { --ink:#1d2125; --paper:#faf8f2; --slate:#eef3f8; --green:#4e9d4e; --green-d:#35703a;
    --blue:#6f9fc8; --blue-d:#3e6e96; --line:#d9e2ec; --muted:#6b7480; --warn:#d98a26; --danger:#c0453b; --yellow:#c9a227; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--paper); font-size:14px; }
  header { display:flex; align-items:center; gap:12px; padding:14px 24px; background:var(--slate); border-bottom:2px solid var(--green); }
  header img { height:34px; width:34px; border-radius:6px; object-fit:cover; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; background:var(--blue); color:#fff; }
  .role { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); }

<script>
const TRF = ["name","native_language","onboarding_date","email","wechat","location","timezone","status","source","gender","entity_type",
  "language_pairs","domains","text_types","cat_tools","internal_rating","manual_rating","manual_rating_reason","trial_result",
  "current_project","role","daily_output","weekend_off","availability",
  "currency","payment_method","settlement_mode","invoice_type","tax_deduction","contract_status","contract_expiry","nda_signed",
  "punctuality_rate","responsiveness","cooperation_rating","last_contact","remarks"];
let DATA=[], PO_ROWS=[], PAIR_OPTIONS=[], LANG_OPTIONS=[], FILTER_FIELDS=[], GENERIC_FILTERS=[], CUR=null, TOKEN="", ROLE="editor", FILTER_QUERY="", PO_IMPORT_FILE=null;

/* ---- 鉴权 ---- */
async function switchRole() {
  const user = document.getElementById("role").value;
  const hint = document.getElementById("roleHint");
  let d;
  try { d = await (await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user})})).json(); }
  catch (e) { TOKEN=""; ROLE="viewer"; document.body.classList.add("viewer"); hint.textContent="登录失败·只读"; hint.className="rolehint ro"; return; }
  TOKEN = d.token; ROLE = d.role;
  document.body.classList.toggle("viewer", ROLE === "viewer");
  if (ROLE === "viewer") { hint.textContent = "只读视角"; hint.className = "rolehint ro"; }
  else if (ROLE === "agent") { hint.textContent = "Agent · 费率/PO 改动进待审"; hint.className = "rolehint ag"; }
  else { hint.textContent = "可编辑"; hint.className = "rolehint ed"; }
  load();
}
function showToast(msg, type){
  const w = document.getElementById("toastWrap");
  const t = document.createElement("div");
  t.className = "toast " + (type || "info");
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(), 300); }, 3200);
}

async function api(method, path, body) {
  const opt = {method, headers:{}};
  if (body !== undefined) { opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
  if (TOKEN) opt.headers["Authorization"] = "Bearer " + TOKEN;
  const r = await fetch(path, opt);
  if (r.status === 403) { showToast("只读视角，无编辑权限（后端已拦截）", "error"); throw new Error("403"); }
  if (!r.ok) { showToast("操作失败：" + (await r.text()), "error"); throw new Error(r.status); }
  const ct = r.headers.get("content-type") || "";
  return ct.includes("json") ? r.json() : r;
}
async function apiForm(method, path, formData) {
  const r = await fetch(path, {method, headers:TOKEN?{"Authorization":"Bearer "+TOKEN}:{}, body:formData});
  let data = {};
  try { data = await r.json(); } catch(e) {}
  if (r.status===403) { showToast("无操作权限", "error"); throw new Error("403"); }
  if (!r.ok) { showToast("操作失败：" + (data.detail || r.status), "error"); throw new Error(r.status); }
  return data;
}
async function downloadAuth(path, filename) {
  const r = await fetch(path, {headers:TOKEN?{"Authorization":"Bearer "+TOKEN}:{}});
  if (!r.ok) { showToast("下载失败", "error"); return; }
  const blob = await r.blob(), url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename || "download"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
const get = p => fetch(p).then(r => r.json());

/* ---- 标签 ---- */
function showTab(t) {
  ["tr","po","pending","audit"].forEach(x => {
    document.getElementById("view-"+x).style.display = x===t ? "" : "none";
    document.getElementById("tab-"+x).classList.toggle("on", x===t);
  });
  if (t==="po") loadPO();
  if (t==="pending") loadPending();
  if (t==="audit") loadAudit();
}

/* ---- 译员主表 ---- */
async function load() {
  const [ov, list, pairs, filterFields] = await Promise.all([
    get("/api/overview"),

async function saveProjectExperience() {
  const projectId = val("pe-id");
  const projectName = val("pe-name");
  if (!projectName) return failField("项目名称必填");
  if (!validDateField("pe-start", "开始日期", false)) return;
  if (!validDateField("pe-end", "结束日期", false)) return;
  if (!validDateField("pe-deadline", "截止日期", false)) return;
  if (!validRange("pe-volume", "剩余量", 0, null, false)) return;
  const pair = readLangPair("pe-src", "pe-tgt");
  if (!!pair.source_lang !== !!pair.target_lang) return failField("源语言和目标语言需同时填写");
  if (pair.source_lang && (!LANG_OPTIONS.includes(pair.source_lang) || !LANG_OPTIONS.includes(pair.target_lang))) {
    return failField("请选择系统语言代码");
  }
  if (pair.source_lang && pair.source_lang === pair.target_lang) return failField("源语言和目标语言不能相同");
  const cooperationSource = document.getElementById("pe-source").value;
  const body = {
    cooperation_source: cooperationSource,
    project_status: document.getElementById("pe-status").value,
    project_name: projectName,
    external_company: cooperationSource === "external" ? val("pe-company") : null,
    role: val("pe-role"),
    source_lang: pair.source_lang,
    target_lang: pair.target_lang,
    start_date: val("pe-start"),
    end_date: val("pe-end"),
    remaining_volume: num("pe-volume"),
    deadline: val("pe-deadline"),
    remarks: val("pe-remarks"),
  };
  try {
    await api(
      projectId ? "PUT" : "POST",
      `/api/translators/${CUR.id}/project-experiences${projectId ? `/${projectId}` : ""}`,
      body,
    );
    showToast(projectId ? "项目经历已更新" : "项目经历已添加", "success");
    await load();
    CUR = DATA.find(item => item.id === CUR.id);
    await renderDetailSummary();
    await subProjects();
  } catch(e) {}
}
async function deleteProjectExperience(projectId) {
  const project = PROJECTS.find(item => item.id === projectId);
  if (!project || !confirm(`删除项目经历「${project.project_name}」？`)) return;
  try {
    await api("DELETE", `/api/translators/${CUR.id}/project-experiences/${projectId}`);
    showToast("项目经历已删除", "success");
    await load();
    CUR = DATA.find(item => item.id === CUR.id);
    await renderDetailSummary();
    await subProjects();
  } catch(e) {}
}

    const all = await get("/api/po");

    sel.innerHTML = months.map(mo=>`<option>${mo}</option>`).join("") || "<option>2026-06</option>";
  }
  const month = sel.value;
  const params = new URLSearchParams();
  [
    ["month", month],
    ["status", filterValue("poStatus")],
    ["translator", filterValue("poTranslator")],
    ["project", filterValue("poProject")],
    ["role", filterValue("poRole")],
    ["source_lang", filterValue("poSourceLang")],
    ["target_lang", filterValue("poTargetLang")],
    ["currency", filterValue("poCurrency")],
    ["pricing_mode", filterValue("poPricingMode")],
    ["settlement_mode", filterValue("poSettlementMode")],
    ["min_amount", filterValue("poMinAmount")],
    ["max_amount", filterValue("poMaxAmount")],
    ["po_number", filterValue("poNumber")],
  ].forEach(([key,value])=>{ if(value) params.set(key,value); });
  if(params.has("min_amount")&&params.has("max_amount")&&Number(params.get("min_amount"))>Number(params.get("max_amount")))return failField("最低金额不能大于最高金额");
  const [list, sum] = await Promise.all([
    get(`/api/po?${params.toString()}`),
    get(`/api/po/summary?${params.toString()}`)]);
  PO_ROWS=list;
  document.getElementById("poCards").innerHTML = Object.entries(sum.by_currency).map(([c,v]) =>
    `<div class="card"><div class="n num">${fmt(v.unpaid)}</div><div class="l">${c} 待付</div></div>
     <div class="card"><div class="n num">${fmt(v.paid)}</div><div class="l">${c} 已付</div></div>`).join("")
    + Object.entries(sum.cumulative_unpaid_by_currency||{}).map(([c,v])=>`<div class="card"><div class="n num">${fmt(v)}</div><div class="l">${c} 跨月累计未付</div></div>`).join("")
    || `<div class="card"><div class="n">0</div><div class="l">本月无数据</div></div>`;
  document.getElementById("poCount").textContent = "筛选结果 " + list.length + " 行";
  document.getElementById("poEmpty").style.display = list.length ? "none" : "block";
  document.getElementById("poRows").innerHTML = list.map(p => {
    const amt = p.amount_ok ? `<span class="num">${fmt(p.amount)}</span>` : `<span class="num amt-bad" title="应为 ${fmt(p.expected_amount)}">${fmt(p.amount)} ⚠</span>`;
    const opts = ["未开票","已开票待付","已支付","有争议"].map(o=>`<option ${o===p.status?"selected":""}>${o}</option>`).join("");
    const modeLabel={per_1000:"按千字",per_hour:"按小时",fixed:"一口价",manual:"手工"}[p.pricing_mode]||p.pricing_mode;
    return `<tr><td><button class="namebtn" onclick="showTranslatorUnpaid(${p.translator_id})">${esc(p.translator_name)}</button></td><td>${esc(p.settlement_month)}</td><td>${esc(p.project)||m()}</td><td>${langPair(p)}</td><td>${esc(p.role)||m()}</td><td>${esc(modeLabel)}</td>
      <td class="num">${p.word_count??m()}</td><td class="num">${p.rate??m()}</td><td>${amt}</td><td>${esc(p.currency)}</td>
      <td><span class="pill po-status-read st-${p.status}">${esc(p.status)}</span><select class="statussel edit-only" onchange="setPOStatus(${p.id},this.value)">${opts}</select></td>
      <td class="muted">${esc(p.po_number)||"—"}</td><td><button class="btn-link edit-only" onclick="editPO(${p.id})">人工修正</button></td></tr>`;
  }).join("");
}
async function applyPOFilters() { await loadPO(); }
async function resetPOFilters() {
  ["poStatus","poTranslator","poProject","poRole","poSourceLang","poTargetLang","poCurrency","poPricingMode","poSettlementMode","poMinAmount","poMaxAmount","poNumber"].forEach(id=>document.getElementById(id).value="");
  const monthSelect=document.getElementById("poMonth");
  if(monthSelect.options.length)monthSelect.selectedIndex=0;
  await loadPO();
}
async function setPOStatus(id, status) { try { const res = await api("PUT",`/api/po/${id}/status`,{status}); if (res && res.pending) showToast(res.msg||"已提交待人工审核", "info"); loadPO(); } catch(e){ loadPO(); } }
function renderProjectlistPreview(preview) {
  const invalid=(preview.invalid_rows||[]).length;
  const summary=`Projectlist 只读预览：源表已勾选 ${preview.checked_rows||0} 行、未勾选 ${preview.unchecked_rows||0} 行；当前选中 ${preview.selected_rows||0} 行，匹配 ${preview.matched_rows||0} 行，其中历史跳过 ${preview.skipped_settled||0} 行、等待数量规则 ${preview.mapping_ready||0} 行，错误 ${invalid} 行${preview.ignored_rows?`，空白业务行 ${preview.ignored_rows} 行`:""}。`;
  const samples=(preview.preview_rows||[]).slice(0,8).map(row=>
    `第 ${row.source_row} 行｜${row.translator_name}｜${row.project||"—"}｜${row.settlement_po_checked?"已勾选，历史跳过":"未勾选，数量规则待确认"}`
  ).join("\n");
  const errors=(preview.invalid_rows||[]).slice(0,20).map(row=>`第 ${row.row} 行：${row.error}`).join("\n");
  const result=document.getElementById("poImportResult");
  result.textContent=summary;
  result.title=[summary,samples,errors].filter(Boolean).join("\n\n");
  showToast(summary,"info");
}
async function previewProjectlistFile(input) {
  const file=input.files&&input.files[0];
  if(!file)return;
  try {
    const state=document.getElementById("projectlistPOState").value;
    const form=new FormData();form.append("file",file);
    const preview=await apiForm("POST",`/api/import/po?preview=true&projectlist_po_state=${encodeURIComponent(state)}`,form);
    if(preview.source_format!=="projectlist")return failField("所选文件不是 Projectlist 格式");
    renderProjectlistPreview(preview);
  } finally {
    input.value="";
  }
}
async function importPOFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  PO_IMPORT_FILE=file;
  try {
    const previewForm=new FormData();previewForm.append("file",file);
    const preview=await apiForm("POST","/api/import/po?preview=true",previewForm);
    if(preview.source_format==="projectlist"){
      renderProjectlistPreview(preview);
      return;
    }
    const samples=(preview.preview_rows||[]).slice(0,5).map(row=>`${row.translator_name||row.translator_id}｜${row.project||"—"}｜${row.expected_amount} ${row.currency}`).join("\n");
    const previewSummary=`预览：可导入 ${preview.ready||0} 行，重复 ${preview.skipped_dup_po||0} 行，错误 ${(preview.invalid_rows||[]).length} 行\n工作表：${preview.sheet||"—"}，表头第 ${preview.header_row||"?"} 行\n\n${samples}`;
    const result = document.getElementById("poImportResult");
    result.textContent=`已预览 ${preview.ready||0} 行，等待确认`;
    result.title=previewSummary+"\n"+(preview.invalid_rows||[]).map(x=>`第 ${x.row} 行：${x.error}`).join("\n");
    if(!confirm(previewSummary+"\n\n确认写入以上有效行？"))return;
    const importForm=new FormData();importForm.append("file",file);
    const data=await apiForm("POST","/api/import/po",importForm);
    const invalid=(data.invalid_rows||[]).length, skipped=data.skipped_dup_po||0;
    const summary=`导入 ${data.imported||0} 行，跳过重复 ${skipped} 行，错误 ${invalid} 行`;
    result.textContent=summary;
    result.title=(data.invalid_rows||[]).map(x=>`${x.sheet||""} 第 ${x.row} 行：${x.error}`).join("\n");
    showToast(summary,invalid?"info":"success");
    if(invalid)console.warn("PO import invalid_rows",data.invalid_rows);
    document.getElementById("poMonth").innerHTML = "";
    loadPO();
  } finally {
    PO_IMPORT_FILE=null;
    input.value = "";
  }
}
function openPO() {
  document.getElementById("p-translator_id").innerHTML = DATA.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");
  document.getElementById("p-id").value="";
  document.getElementById("poModalTitle").textContent="新增 PO 结算行";
  document.getElementById("p-source_lang").value = "";
  document.getElementById("p-target_lang").value = "";
  document.getElementById("p-settlement_month").value = document.getElementById("poMonth").value || month().replace(/-\d\d$/, "-06");
  ["p-project","p-word_count","p-rate","p-amount","p-po_number","p-remarks"].forEach(i=>document.getElementById(i).value="");
  document.getElementById("p-pricing_mode").value="per_1000";
  document.getElementById("p-role").value="翻译";
  updatePOPricing();
  document.getElementById("poMask").classList.add("open");
}
async function fillPORate() {
  const tid = Number(document.getElementById("p-translator_id").value);
  const pair = readLangPair("p-source_lang", "p-target_lang");
  const role=document.getElementById("p-role").value;
  if(!tid)return;
  const params=new URLSearchParams({translator_id:String(tid),role,currency:document.getElementById("p-currency").value});
  const project=val("p-project");if(project)params.set("project",project);
  if(pair.source_lang)params.set("source_lang",pair.source_lang);
  if(pair.target_lang)params.set("target_lang",pair.target_lang);
  const matched=await get(`/api/po/price-match?${params.toString()}`);
  if(!matched.matched)return;
  document.getElementById("p-pricing_mode").value=matched.pricing_mode;
  document.getElementById("p-rate").value=matched.rate??"";
  document.getElementById("p-amount").value=matched.amount??"";
  if(matched.currency)document.getElementById("p-currency").value=matched.currency;
  updatePOPricing();
  document.getElementById("p-pricing-hint").textContent+=(matched.source==="project_price"?" 已自动匹配最新项目价格，可人工修改。":" 已按语言对价格自动带入。");
}
function updatePOPricing() {
  const role=document.getElementById("p-role"),mode=document.getElementById("p-pricing_mode");
  if(!role||!mode)return;
  if(role.value==="一口价")mode.value="fixed";
  else if(["LQA","LQE"].includes(role.value)&&mode.value==="per_1000")mode.value="per_hour";
  const hourly=mode.value==="per_hour", calculated=["per_1000","per_hour"].includes(mode.value);
  document.getElementById("p-quantity-label").textContent=hourly?"小时数":"字数（字）";
  document.getElementById("p-rate-label").textContent=hourly?"单价（/小时）":"单价（/千字）";
  document.getElementById("p-word_count").disabled=!calculated;
  document.getElementById("p-rate").disabled=!calculated;
  document.getElementById("p-amount").disabled=calculated;
  document.getElementById("p-pricing-hint").textContent={
    per_1000:"金额 = 字数 ÷ 1000 × 单价；单价可按语言对自动取价。",
    per_hour:"金额 = 小时数 × 小时单价。",
    fixed:"一口价直接使用固定总额。",
    manual:"手工金额用于明确的结算调整。",
  }[mode.value];
}
async function savePO() {
  const pair = readLangPair("p-source_lang", "p-target_lang");
  const b = {translator_id:Number(document.getElementById("p-translator_id").value), settlement_month:val("p-settlement_month"),
    project:val("p-project"), source_lang:pair.source_lang, target_lang:pair.target_lang,
    role:document.getElementById("p-role").value, pricing_mode:document.getElementById("p-pricing_mode").value,
    word_count:num("p-word_count"), rate:num("p-rate"), amount:num("p-amount"),
    currency:document.getElementById("p-currency").value, status:document.getElementById("p-status").value, po_number:val("p-po_number"), remarks:val("p-remarks")};
  if (!b.translator_id || !b.settlement_month) { showToast("译员和结算月必填", "error"); return; }
  if (!validatePOForm()) return;
  const id=val("p-id");
  try { const res = await api(id?"PUT":"POST",id?`/api/po/${id}`:"/api/po", b);
    if (res && res.pending) showToast(res.msg || "已提交待人工审核", "info");
    closeModal("poMask"); document.getElementById("poMonth").innerHTML=""; loadPO(); } catch(e){}
}
function editPO(id) {
  const p=PO_ROWS.find(row=>row.id===id);if(!p)return;
  document.getElementById("p-translator_id").innerHTML=DATA.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");
  document.getElementById("p-id").value=p.id;
  document.getElementById("poModalTitle").textContent="人工修正 PO";
  ["translator_id","settlement_month","project","source_lang","target_lang","role","pricing_mode","word_count","rate","amount","currency","status","po_number","remarks"].forEach(key=>{
    const element=document.getElementById("p-"+key);if(element)element.value=p[key]??"";
  });
  updatePOPricing();
  document.getElementById("poMask").classList.add("open");
}
async function showTranslatorUnpaid(translatorId) {
  const data=await get(`/api/po/unpaid/${translatorId}`);
  document.getElementById("unpaidTitle").textContent=`${data.translator_name} · 未结算明细`;
  document.getElementById("unpaidSummary").innerHTML=Object.entries(data.totals||{}).map(([currency,total])=>detailMetric(`${currency} 未付`,total)).join("")||detailMetric("未付",0);
  const rows=(data.rows||[]).map(row=>`<tr><td>${esc(row.settlement_month)}</td><td>${esc(row.project)||"—"}</td><td>${esc(row.role)||"—"}</td><td>${row.word_count??"—"}</td><td>${fmt(row.amount)} ${esc(row.currency)}</td><td>${esc(row.status)}</td></tr>`).join("");
  document.getElementById("unpaidBody").innerHTML=tbl(["结算月","项目","角色","数量","未付金额","状态"],rows);
  document.getElementById("unpaidMask").classList.add("open");
}

/* ---- 审计 ---- */
async function loadAudit() {
  let rows = [];
  try { rows = await api("GET","/api/audit"); } catch(e){ rows = []; }
  document.getElementById("auditCount").textContent = "最近 " + rows.length + " 条";
  document.getElementById("auditEmpty").style.display = rows.length ? "none" : "block";
  document.getElementById("auditRows").innerHTML = rows.map(a=>`<tr><td>${esc(a.created_at)}</td><td>${esc(a.user)||"—"}</td><td>${esc(a.action)}</td><td>${esc(a.entity)} ${a.entity_id??""}</td><td>${esc(a.detail)||"—"}</td></tr>`).join("");
}
async function loadPending() {
  let rows=[]; try { rows = await api("GET","/api/pending"); } catch(e){ rows=[]; }
  document.getElementById("pendCount").textContent = "待审 " + rows.length + " 条";
  document.getElementById("pendEmpty").style.display = rows.length ? "none" : "block";
  document.getElementById("pendRows").innerHTML = rows.map(p => {
    const kind = {rate_change:"报价变更", po:"PO 新增", po_status:"PO 改状态"}[p.kind] || p.kind;
    const d = p.payload; let c = "";
    if (p.kind==="rate_change") c = `${langPair(d)} ${esc(d.task_type)} 新费率 ${d.new_rate}（${esc(d.reason)||"—"}）`;
    else if (p.kind==="po") c = `${esc(d.settlement_month)} ${langPair(d)} ${esc(d.role)} ${d.word_count}×${d.rate} ${esc(d.currency)}`;
    else if (p.kind==="po_status") c = `PO#${d.pid} → ${esc(d.status)}`;
    return `<tr><td>${esc(p.created_at)}</td><td>${esc(p.created_by)}</td><td>${kind}</td><td>${esc(p.translator_name)||"—"}</td><td>${c}</td>
      <td><button class="btn-link" onclick="approvePend(${p.id})">批准</button><button class="btn-link danger" onclick="rejectPend(${p.id})">驳回</button></td></tr>`;
  }).join("");
}
async function approvePend(id){ try{ await api("POST",`/api/pending/${id}/approve`); loadPending(); load(); }catch(e){} }
async function rejectPend(id){ try{ await api("POST",`/api/pending/${id}/reject`); loadPending(); }catch(e){} }

if (document.addEventListener) {
  document.addEventListener("click", e => { if (!e.target.closest(".lang-combo")) closeLangMenus(); });
  document.addEventListener("scroll", () => document.querySelectorAll(".lang-combo.open").forEach(positionLangMenu), true);
}
if (typeof window !== "undefined" && window.addEventListener) {
  window.addEventListener("resize", () => document.querySelectorAll(".lang-combo.open").forEach(positionLangMenu));
}
document.getElementById("search").addEventListener("input", render);
switchRole();   // 默认以资源端登录并加载
